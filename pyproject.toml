[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assure-package-cleaner"
version = "0.1.0"
description = "Deletes stale packages from the Spectra Assure portal based on a configurable retention period"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "types-requests>=2.33.0.20260408",
]

[project.scripts]
assure-package-cleaner = "assure_package_cleaner.__main__:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# The explicit `select` below pins which lint rules run, but not which files the
# *formatter* walks. 0.16 began formatting Python blocks inside Markdown, so
# `ruff format --check .` covered 9 files on 0.15.22 and 11 on 0.16.2 — and CI floats
# to whatever pip resolves. Excluding Markdown keeps that surface fixed too.
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# An explicit `select`, not `extend-select`. `extend-select` adds to whatever ruff's
# default rule set happens to be, so a ruff release that widens the defaults silently
# widens our lint surface — that is what broke CI and forced the <0.16 pin. Listing the
# rules outright makes the surface deterministic across versions; adopting a new rule
# family is now a deliberate edit here.
select = [
  "E4",   # pycodestyle — ruff's default subset
  "E7",
  "E9",
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
